  platforms:
  wordpress:
    name: "WordPress"
    type: "cms"
    composio_app: "wordpress"
    api_base: "https://public-api.wordpress.com"
    requires_auth: true
    post_types:
      - text
      - image
      - video
      - link
      - page
      - custom_post_type
    max_post_length: 100000
    max_media_size_mb: 100
    rate_limit: "60 requests per minute"
    content_rules:
      - "SEO optimization required for all posts"
      - "Use featured images for every post"
      - "Proper categories and tags required"
      - "No excessive keyword stuffing"
      - "Block editor compatible content preferred"
    features:
      - post_publishing
      - page_management
      - media_library
      - categories_tags
      - featured_images
      - seo_metadata
      - custom_post_types
      - draft_workflow
      - scheduled_publishing
      - revisions
    integrations:
      - woocommerce
      - jetpack
      - yoast_seo
      - elementor
    default_categories: []
    monitoring_features:
      - post_analytics
      - traffic_sources
      - search_console
      - reader_stats

  wix:
    name: "Wix"
    type: "website_builder"
    composio_app: "wix"
    api_base: "https://www.wix.com/velo"
    requires_auth: true
    post_types:
      - text
      - image
      - video
      - portfolio
      - blog_post
      - page
    max_post_length: 50000
    max_media_size_mb: 50
    rate_limit: "30 requests per minute"
    content_rules:
      - "Mobile-responsive design required"
      - "Use Wix ADI or editor for layout"
      - "Optimize images for web"
      - "SEO meta tags required"
    features:
      - blog_publishing
      - page_builder
      - drag_drop_editor
      - mobile_responsive
      - seo_tools
      - velo_code
      - business_account
      - appointments
      - bookings
      - payments
    integrations:
      - wix_editor
      - wix_velo
      - wix_sites
      - wix_business
      - wix_payments
    default_categories: []
    monitoring_features:
      - site_analytics
      - visitor_tracking
      - conversion_tracking
      - seo_rankings
  google_play_books:
    name: "Google Play Books"
    type: "ebook_marketplace"
    composio_app: "google_play_books"
    api_base: "https://www.googleapis.com/books/v1"
    requires_auth: true
    post_types:
      - ebook
      - audiobook
      - periodical
      - textbook
    max_post_length: 10000
    rate_limit: "60 requests per minute"
    content_rules:
      - "EPUB or PDF format required"
      - "Book metadata required (title, author, description, ISBN)"
      - "Cover image required (minimum 800x1280px)"
      - "Proper categorization required"
      - "No copyrighted material without authorization"
    features:
      - book_upload
      - ebook_distribution
      - global_reach
      - preorder_support
      - pricing_control
      - promo_codes
      - analytics
      - reader_engagement
      - reviews_management
    integrations:
      - google_drive
      - stripe_payments
      - google_analytics
    default_categories: []
    monitoring_features:
      - sales_analytics
      - reader_stats
      - conversion_rates
      - review_sentiment
      - global_reach
  gumroad:
    name: "Gumroad"
    type: "digital_marketplace"
    composio_app: "gumroad"
    api_base: "https://api.gumroad.com/v2"
    requires_auth: true
    post_types:
      - digital_product
      - course
      - ebook
      - membership
      - template
      - bundle
    max_post_length: 5000
    rate_limit: "60 requests per minute"
    content_rules:
      - "Product description required with features and benefits"
      - "Thumbnail image required (minimum 360x200px)"
      - "Pricing must be set"
      - "Category must be selected"
      - "No illegal or copyrighted content"
    features:
      - product_creation
      - digital_delivery
      - payment_processing
      - subscription_support
      - drip_content
      - coupons
      - affiliate_program
      - analytics
      - email_capture
      - preview_pages
    integrations:
      - stripe_payments
      - paypal
      - mailchimp
      - convertkit
      - twitter_creator
    default_categories: []
    monitoring_features:
      - sales_analytics
      - conversion_rates
      - customer_emails
      - refund_tracking
      - affiliate_stats

  payhip:
    name: "Payhip"
    type: "digital_marketplace"
    composio_app: "payhip"
    api_base: "https://api.payhip.com/v2"
    requires_auth: true
    post_types:
      - digital_product
      - course
      - membership
      - ebook
      - software
    max_post_length: 5000
    rate_limit: "60 requests per minute"
    content_rules:
      - "Product description required"
      - "File upload required for all products"
      - "Pricing must be set (free or paid)"
      - "Category must be selected"
    features:
      - product_creation
      - digital_delivery
      - payment_processing
      - membership_support
      - affiliate_program
      - free_products
      - pay_what_you_want
      - coupons
      - analytics
      - email_list
    integrations:
      - stripe_payments
      - paypal
      - mailchimp
      - convertkit
      - woocommerce
    default_categories: []
    monitoring_features:
      - sales_analytics
      - conversion_rates
      - customer_list
      - affiliate_stats
      - revenue_tracking
