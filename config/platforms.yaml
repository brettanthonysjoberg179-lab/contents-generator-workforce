  wordpress:
    name: "WordPress"
    type: "cms"
    composio_app: "wordpress"
    api_base: "https://public-api.wordpress.com"
    requires_auth: true
    post_types:
      - text
      - image
      - video
      - link
      - page
      - custom_post_type
    max_post_length: 100000
    max_media_size_mb: 100
    rate_limit: "60 requests per minute"
    content_rules:
      - "SEO optimization required for all posts"
      - "Use featured images for every post"
      - "Proper categories and tags required"
      - "No excessive keyword stuffing"
      - "Block editor compatible content preferred"
    features:
      - post_publishing
      - page_management
      - media_library
      - categories_tags
      - featured_images
      - seo_metadata
      - custom_post_types
      - draft_workflow
      - scheduled_publishing
      - revisions
    integrations:
      - woocommerce
      - jetpack
      - yoast_seo
      - elementor
    default_categories: []
    monitoring_features:
      - post_analytics
      - traffic_sources
      - search_console
      - reader_stats

  wix:
    name: "Wix"
    type: "website_builder"
    composio_app: "wix"
    api_base: "https://www.wix.com/velo"
    requires_auth: true
    post_types:
      - text
      - image
      - video
      - portfolio
      - blog_post
      - page
    max_post_length: 50000
    max_media_size_mb: 50
    rate_limit: "30 requests per minute"
    content_rules:
      - "Mobile-responsive design required"
      - "Use Wix ADI or editor for layout"
      - "Optimize images for web"
      - "SEO meta tags required"
    features:
      - blog_publishing
      - page_builder
      - drag_drop_editor
      - mobile_responsive
      - seo_tools
      - velo_code
      - business_account
      - appointments
      - bookings
      - payments
    integrations:
      - wix_editor
      - wix_velo
      - wix_sites
      - wix_business
      - wix_payments
    default_categories: []
    monitoring_features:
      - site_analytics
      - visitor_tracking
      - conversion_tracking
      - seo_rankings